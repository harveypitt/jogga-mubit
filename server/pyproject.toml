[project]
name = "jogga"
version = "0.1.0"
description = "Jogga server: runs, targets and coach notes"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pyjwt[crypto]==2.10.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.10",
    "posthog==6.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-psycopg2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jogga*"]

[tool.setuptools.package-data]
jogga = ["prompts/*.md", "prompts/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jogga"]

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true
